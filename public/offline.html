<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#b77996" />
  <title>Sem conexão | Equilíbrio Saudável</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg,#fffafd,#f8eaf2);
      color: #503b49;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(100%,430px);
      padding: 38px 28px;
      background: #fff;
      border: 1px solid #efdce8;
      border-radius: 26px;
      box-shadow: 0 22px 60px rgba(110,66,95,.1);
    }
    img {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      object-fit: cover;
    }
    h1 {
      margin: 25px 0 12px;
      font-family: Georgia,serif;
      font-size: 32px;
    }
    p {
      color: #917b89;
      font-size: 14px;
      line-height: 1.8;
    }
    button {
      margin-top: 18px;
      padding: 15px 25px;
      border: 0;
      border-radius: 13px;
      background: #a86e91;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/images/favicon.png" alt="Equilíbrio Saudável" />
    <h1>Você está offline</h1>
    <p>
      Sua jornada continua assim que a conexão voltar.
      Conecte-se à internet para acessar receitas,
      comunidade e sua área de membros.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
